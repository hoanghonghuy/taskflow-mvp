name: synapse-sdd
description: Synapse SDD workflow — proposal, specs delta, design, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    template: templates/proposal.md
    instruction: |
      Create proposal.md that establishes WHY this change is needed.

      Sections:
      - **Why**: problem or opportunity (1–2 sentences). Why now?
      - **What Changes**: bullets; mark breaking changes with **BREAKING**.
      - **Capabilities**: new vs modified specs (kebab-case names under openspec/specs/).
      - **Impact**: code, APIs, deps, ops.

      Keep concise. Implementation detail belongs in design.md.
    requires: []
  - id: specs
    generates: specs/
    template: templates/spec.md
    instruction: |
      Create one specs/<capability>/spec.md per capability in the proposal.

      Use delta headers:
      - ## ADDED Requirements
      - ## MODIFIED Requirements (full requirement text, not partial)
      - ## REMOVED Requirements (include Reason + Migration)

      Each requirement:
      - ### Requirement: <name>  (or ### REQ-XXX Title)
      - Normative SHALL/MUST language
      - At least one #### Scenario: with Given/When/Then (or WHEN/THEN)
    requires: [proposal]
  - id: design
    generates: design.md
    template: templates/design.md
    instruction: |
      Document HOW: approach, alternatives rejected, risks, TDD strategy.
      Reference concrete packages/paths. Align with proposal capabilities.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    template: templates/tasks.md
    instruction: |
      Checklist of implementation work. Prefer Red→Green→Refactor markers for new behavior.
      Trace tasks to REQ ids. Phase gates and smoke checks when the change is multi-part.
    requires: [design, specs]
workflow: sdd
