# Dev stack — mount source + npm run dev (giống iris-app/web). Sửa code không cần --build.
# Production: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - taskflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - taskflow-net

  backend:
    image: node:22-alpine
    container_name: taskflow-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    command: >
      sh -c "npm ci
      && npx prisma generate
      && npx prisma migrate deploy
      && npm run dev"
    networks:
      - taskflow-net

  frontend:
    image: node:22-alpine
    container_name: taskflow-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      MOCK_MODE: ${MOCK_MODE:-false}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - taskflow-net

volumes:
  taskflow_pg_data:
    name: docker_taskflow_pg_data
  backend_node_modules:
    name: docker_taskflow_backend_node_modules
  frontend_node_modules:
    name: docker_taskflow_frontend_node_modules

networks:
  taskflow-net:
    driver: bridge
