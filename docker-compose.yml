# Dev stack — mount source + hot reload.
# `docker compose up -d --build` → rebuild image (deps).
# `docker compose restart frontend` → restart Next nhanh, không npm ci lại (trừ khi lockfile đổi).
# Production: dùng frontend/Dockerfile + backend/Dockerfile (standalone).

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - taskflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - taskflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: taskflow-backend:dev
    container_name: taskflow-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - taskflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: taskflow-frontend:dev
    container_name: taskflow-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      MOCK_MODE: ${MOCK_MODE:-false}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING_INTERVAL: "1000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Chỉ local (loopback). Công khai qua Caddy :80/:443.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - taskflow-net

  caddy:
    image: caddy:2-alpine
    container_name: taskflow-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      UPSTREAM_FRONTEND: frontend:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - taskflow-net

volumes:
  taskflow_pg_data:
    name: docker_taskflow_pg_data
  backend_node_modules:
    name: docker_taskflow_backend_node_modules
  frontend_node_modules:
    name: docker_taskflow_frontend_node_modules
  caddy_data:
    name: docker_taskflow_caddy_data
  caddy_config:
    name: docker_taskflow_caddy_config

networks:
  taskflow-net:
    driver: bridge
